# SignalIQ — full stack for self-hosted installs.
#
#   docker compose up -d
#
# Seven services: postgres, redis, api, worker, beat, scheduler, web.
# The API runs migrations on startup. The scheduler runs the
# article-schedule loop every minute (no host crontab required).
#
# The user's API keys go in .env (see .env.example). Each install
# uses its own keys; nothing is shared between users.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: signaliq
      POSTGRES_PASSWORD: signaliq
      POSTGRES_DB: signaliq
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signaliq"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    image: signaliq-api:latest
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    dns:
      - 8.8.8.8
      - 8.8.4.4
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://signaliq_app:signaliq_app@postgres:5432/signaliq
      DATABASE_URL_SYNC: postgresql://signaliq:signaliq@postgres:5432/signaliq
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS_ON_STARTUP: "true"
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: signaliq-worker:latest
    command: celery -A apps.worker.celery_app worker --loglevel=info --pool=solo -Q default,ingestion --hostname=worker1@%h
    dns:
      - 8.8.8.8
      - 8.8.4.4
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql+asyncpg://signaliq_app:signaliq_app@postgres:5432/signaliq
      DATABASE_URL_SYNC: postgresql://signaliq:signaliq@postgres:5432/signaliq
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    image: signaliq-beat:latest
    command: celery -A apps.worker.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    dns:
        - 8.8.8.8
        - 8.8.4.4
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    depends_on:
      - redis
    restart: unless-stopped

  scheduler:
    image: signaliq-scheduler:latest
    command: python -m scripts.scheduler_loop
    dns:
      - 8.8.8.8
      - 8.8.4.4
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://signaliq_app:signaliq_app@postgres:5432/signaliq
      DATABASE_URL_SYNC: postgresql://signaliq:signaliq@postgres:5432/signaliq
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: signaliq-web:latest
    ports: ["3000:3000"]
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      NEXT_PUBLIC_API_URL: ""
    volumes:
      - ./apps/web/.next:/app/.next
      - ./apps/web/src:/app/src  
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
